		<!-- FRUITY_FAST_WASM_GZIP_V1: compress Godot WebAssembly streaming download -->
<script>
(function () {
  const fetchOriginal = window.fetch.bind(window);
  window.fetch = function (resource, options) {
    const path = typeof resource === 'string' ? resource : (resource && resource.url ? resource.url : String(resource));
    if (!/(?:^|\/)index\.wasm(?:[?#].*)?$/.test(path) || typeof DecompressionStream === 'undefined') {
      return fetchOriginal(resource, options);
    }
    return fetchOriginal('index.wasm.gz', {credentials:'same-origin'}).then(function (compressed) {
      if (!compressed.ok || !compressed.body) return fetchOriginal(resource, options);
      const stream = compressed.body.pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream, {status:200,headers:{'Content-Type':'application/wasm'}});
    }).catch(function () { return fetchOriginal(resource, options); });
  };
})();
</script>

<script id="fruity-fast-wasm">
/* Stream a much smaller, gzip-compressed WebAssembly download.
 * Browser transparently decompresses the WASM on the fly.
 * Older browsers fall back to the standard uncompressed .wasm.
 */
(function () {
  if (!('DecompressionStream' in window) || !('fetch' in window)) return;
  const upstreamFetch = window.fetch.bind(window);
  window.fetch = function (input, options) {
    let source;
    try {
      source = input instanceof Request ? input.url : String(input);
      if (new URL(source, location.href).pathname.split('/').pop() !== 'index.wasm') {
        return upstreamFetch(input, options);
      }
    } catch (_) {
      return upstreamFetch(input, options);
    }
    return upstreamFetch('index.wasm.gz', options).then(response => {
      if (!response.ok || !response.body) return upstreamFetch(input, options);
      try {
        const expanded = response.body.pipeThrough(new DecompressionStream('gzip'));
        const headers = new Headers({'Content-Type': 'application/wasm'});
        return new Response(expanded, {status: 200, headers});
      } catch (_) {
        return upstreamFetch(input, options);
      }
    }).catch(() => upstreamFetch(input, options));
  };
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5567096,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
